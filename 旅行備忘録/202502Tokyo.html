<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap"
      rel="stylesheet"
    />
    <title>202502</title>
  </head>
  <body>

    <main>
      <div class="tokyo25_title">
        <h1 class="title_text"> </h1>
      </div>
      <div class="trip-info_cont">
        <div class="trip_left-section">
          <div class="trip_topic">
            <h2 class="trip_label goto">行先</h2>
            <p class="trip_value">東京　お台場・品川</p>
            <h2 class="trip_label data">日程</h2>
            <p class="trip_value">2025年2月26日~28日</p>
          </div>
        </div>
        <div class="trip_right-section">
          <div class="trip-plan_li">
            <h2 class="trip_label plan">目的</h2>
            <ul>
              <li class="trip_value">NieRシリーズのコラボカフェに行く</li>
              <li class="trip_value">お台場散策、 <a href="https://tokyo-joypolis.com/" class = "shop_link">ジョイポリス</a>で遊ぶ</li>
              <li class="trip_value">品川でお買い物</li>
              <li class="trip_value">ライブ参戦</li>
            </ul>
            <div class="trip_topic">           
              <h2 class="trip_label memo">行ってみて</h2>
              <p class="trip_value">
              </p>
          </div>
          </div>

        </div>
        <div></div>
      </div>
      <div>
        
        <div class="photo_list">
          <div class="photo_item">
            <img
              src="img/IMG_4934.jpg"
              alt="アクアリウム"
              width="400"
              height=""
            />
            <p class="photo_text"> 初日食べた麻婆豆腐丼!<br>タイミングよく入れたお店で見つけた  <br>大盛でおいしかった！</p>
          </div>
          <div class="photo_item">
            <p class="photo_text"> お台場で見つけたアクアリウム <br>金魚が可愛かった</p>
            <img
              src="img/IMG_4955.jpg"
              alt="アクアリウム"
              width="400"
              height=""
            />

          </div>
          <div class="photo_item">
            <img
              src="img/IMG_4960.jpg"
              alt="アクアリウム"
              width="400"
              height=""
            />
            <p class="photo_text"> 和がモチーフのアクアリウムらしく<br>花札のおみくじも</p>
          </div>
          <div class="photo_item">
            <p class="photo_text">NieRカフェ!<br>欲しいコースター全部当たった</p>
            <img
              src="img/IMG_4981.jpg"
              alt="アクアリウム"
              width="800"
              height=""
            />
            
          </div>
          <div class="photo_item">
            <img
              src="img/img_4986.jpg"
              alt="アクアリウム"
              width="600"
              height=""
            />
            <p class="photo_text"> アクアリウムの内装の一部<br>水槽だけでなく周りも綺麗だった</p>
          </div>
      </div>
    </main>
    
  </body>
  <footer>
    <a href="index.html" class ="go_top_text"> Top</a>
</footer>

<div id="imageModal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImage">
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', (event) => {
     
      const heroView = document.querySelector('.tokyo25_title');
      const photoList = document.querySelector('.photo_list');

      
      heroView.addEventListener('click', () => {
        photoList.style.display = 'grid';
      });

     
      const modal = document.getElementById('imageModal'); 
      const modalImage = document.getElementById('modalImage');
     
      const closeBtn = document.getElementsByClassName('close')[0];


      const images = document.querySelectorAll('.photo_list .photo_item img');

      images.forEach(img => {
        img.addEventListener('click', () => {
          modal.style.display = 'block'; 
          modalImage.src = img.src;
        });
      });


      closeBtn.onclick = function() {
        modal.style.display = 'none';
      }

      modal.onclick = function(event) {
        if (event.target === modal) { 
          modal.style.display = 'none';
        }
      }

    });
  </script>
</html>
