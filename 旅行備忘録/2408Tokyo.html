<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet" />
  <title>2020408</title>
</head>

<body>

  <main>
    <div class="tokyo24_title">
      <h1 class="title_text"> </h1>
    </div>
    <div class="trip-info_cont">
      <div class="trip_left-section">
        <div class="trip_topic">
          <h2 class="trip_label goto">行先</h2>
          <p class="trip_value">東京・横浜</p>

          <h2 class="trip_label data">日程</h2>
          <p class="trip_value">2024年8月16日~17日</p>
        </div>
      </div>
      <div class="trip_right-section">
        <div class="trip-plan_li">
          <h2 class="trip_label plan">目的</h2>
          <ul>
            <li class="trip_value">ライブ参戦</li>
            <li class="trip_value">横浜お買い物</li>
            <li class="trip_value"><a href="https://immersivefort.com/" class="shop_link">イマーシブフォート東京</a>で遊ぶ</li>
            <li class="trip_value">ドラマの聖地巡り</li>
          </ul>


        </div>
        <div class="trip_topic">
          <h2 class="trip_label memo">行ってみて</h2>
          <p class="trip_value">台風直撃で予定がぐちゃぐちゃに</p>
        </div>
      </div>
      <div></div>
    </div>
    <div>

      <div class="photo_list">
        <div class="photo_item">
          <img src="img/IMG_2023.jpg" alt="アクアリウム" width="400" height="" />
          <p class="photo_text"> ドラマ「SPEC」でよく出てきた餃子屋さん<br><br>知ってる料理多くて <br> テンション上がりまくった</p>
        </div>
        <div class="photo_item">
          <p class="photo_text"> せっかく横浜まで行ったのに<br>台風のせいでどこの店も閉まってた時の写真</p>
          <img src="img/IMG_2037.jpg" alt="アクアリウム" width="400" height="" />

        </div>
        <div class="photo_item">
          <img src="img/IMG_2049.jpg" alt="アクアリウム" width="400" height="" />
          <p class="photo_text"> 分厚いピザをたくさん食べた<br></p>
        </div>
        <div class="photo_item">
          <p class="photo_text">ド悪天候横浜<br>ずぶ濡れで居酒屋徘徊</p>
          <img src="img/IMG_2051.jpg" alt="アクアリウム" width="800" height="" />

        </div>
        <div class="photo_item">
          <img src="img/img_2062.jpg" alt="アクアリウム" width="600" height="" />
          <p class="photo_text">イマーシブフォートのアトラクション<br>体験型で没入感があって楽しかった</p>
        </div>
        <div class="photo_item">
          <p class="photo_text">ド晴天お台場<br>暑すぎた</p>
          <img src="img/IMG_2057.jpg" alt="アクアリウム" width="800" height="" />
        </div>
  </main>
</body>
<footer>
  <a href="index.html" class="go_top_text"> Top</a>
</footer>
<div id="imageModal" class="modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImage">
</div>
<script>
  document.addEventListener('DOMContentLoaded', (event) => {

    const heroView = document.querySelector('.tokyo24_title');
    const photoList = document.querySelector('.photo_list');


    heroView.addEventListener('click', () => {
      photoList.style.display = 'grid';
    });


    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');

    const closeBtn = document.getElementsByClassName('close')[0];


    const images = document.querySelectorAll('.photo_list .photo_item img');

    images.forEach(img => {
      img.addEventListener('click', () => {
        modal.style.display = 'block';
        modalImage.src = img.src;
      });
    });


    closeBtn.onclick = function () {
      modal.style.display = 'none';
    }

    modal.onclick = function (event) {
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }

  });
</script>

</html>
